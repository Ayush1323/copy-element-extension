<!doctype html>
<html><head><meta charset="utf-8"><title>Quality</title>
<style>
  html,body{margin:0;background:#fff;color:#000;font:14px/1.4 Arial,sans-serif}
  /* 1-device-pixel-sensitive content: hairlines, checkerboard, small text */
  #lines{position:absolute;left:20px;top:20px;width:300px;height:120px;background:repeating-linear-gradient(90deg,#000 0 1px,#fff 1px 2px)}
  #checker{position:absolute;left:340px;top:20px;width:200px;height:120px;background:conic-gradient(#000 25%,#fff 0 50%,#000 0 75%,#fff 0) 0 0/4px 4px}
  #text{position:absolute;left:20px;top:160px;width:520px}
  #tall{position:absolute;left:0;top:300px;width:100%;height:2600px;background:linear-gradient(#fff,#dbeafe)}
  #tall i{position:absolute;left:30px;width:400px;height:1px;background:#000}
</style></head>
<body>
<div id="lines"></div><div id="checker"></div>
<div id="text">The quick brown fox jumps over the lazy dog 0123456789 — sharp small text must stay sharp in a screenshot.</div>
<div id="tall"></div>
<script>
  const t = document.getElementById('tall');
  for (let y = 10; y < 2600; y += 37) { const i = document.createElement('i'); i.style.top = y + 'px'; t.appendChild(i); }
</script>
</body></html>
