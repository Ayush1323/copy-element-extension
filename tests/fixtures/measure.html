<!doctype html>
<html><head><meta charset="utf-8"><title>Measure</title>
<style>
  html,body{margin:0;background:#fff;font:14px/1.4 Arial,sans-serif;color:#111}
  body{padding:40px}
  #flex{display:flex;gap:24px;padding:20px;background:#eef2ff;width:560px;margin:0 0 40px}
  .box{width:120px;height:80px;margin:10px 0;padding:12px;border:2px solid #4f46e5;background:#c7d2fe;box-sizing:content-box}
  #grid{display:grid;grid-template-columns:repeat(3,100px);gap:16px 32px;width:420px;margin:0 0 40px}
  #grid div{height:50px;background:#fde68a}
  #a{position:absolute;left:660px;top:60px;width:160px;height:90px;background:#bbf7d0}
  #b{position:absolute;left:760px;top:260px;width:140px;height:70px;background:#fecaca}
  #outer{position:absolute;left:640px;top:420px;width:300px;height:160px;background:#e0f2fe;padding:30px 20px}
  #inner{width:120px;height:60px;background:#7dd3fc}
  #link{color:#b91c1c}
</style></head>
<body>
  <div id="flex"><div class="box" id="b1">One</div><div class="box" id="b2">Two</div><div class="box" id="b3">Three</div></div>
  <div id="grid"><div></div><div></div><div></div><div></div><div></div><div></div></div>
  <p><a id="link" href="#nav">A link</a></p>
  <div id="a">A</div><div id="b">B</div>
  <div id="outer"><div id="inner"></div></div>
</body></html>
