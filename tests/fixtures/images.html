<!doctype html>
<html><head><meta charset="utf-8"><title>Images</title>
<style>
  body{font:16px sans-serif;padding:30px} img{display:block;margin-bottom:24px}
  #hero{width:420px;height:180px;margin-bottom:24px;color:#fff;font-weight:700;padding:16px;box-sizing:border-box;
    background:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.25)),url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='840' height='360'%3E%3Crect width='840' height='360' fill='%23db2777'/%3E%3C/svg%3E") center/cover}
  #grad{width:200px;height:60px;margin-bottom:24px;background:linear-gradient(red,blue)}
</style></head>
<body>
<h1>Gallery</h1>
<img id="banner" alt="Wide banner" style="width:296px;height:166px" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='767' height='278'%3E%3Crect width='767' height='278' fill='%232563eb'/%3E%3C/svg%3E">
<a href="/nav"><img id="linked" alt="" style="width:50px;height:50px" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='100' height='100'%3E%3Crect width='100' height='100' fill='%234f46e5'/%3E%3C/svg%3E"></a>
<div id="hero"><span id="hero-text">Hero text over a CSS background</span></div>
<div id="grad">gradient only</div>
<!-- real-world patterns: pointer-events:none photo behind a stretched-link card, pseudo-element background, clipped + invisible images -->
<div id="ghost" style="position:relative;width:300px;height:120px;margin-bottom:24px">
  <img id="ghost-img" alt="" style="position:absolute;inset:0;width:100%;height:100%;margin:0;pointer-events:none" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='600' height='240'%3E%3Crect width='600' height='240' fill='%230891b2'/%3E%3C/svg%3E">
  <a href="/nav" style="position:absolute;inset:0;color:#fff;padding:8px">Card with a stretched link</a>
</div>
<div id="pseudo" style="position:relative;width:260px;height:90px;margin-bottom:24px;overflow:hidden">pseudo background
  <style>#pseudo::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:-1;background:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='520' height='180'%3E%3Crect width='520' height='180' fill='%23f59e0b'/%3E%3C/svg%3E") center/cover}</style>
</div>
<div id="clip" style="width:100px;height:50px;overflow:hidden;margin-bottom:24px"><img id="clip-img" alt="" style="width:300px;height:50px;margin:0" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='300' height='50'%3E%3Crect width='300' height='50' fill='%23ef4444'/%3E%3C/svg%3E"></div>
<img id="invisible" alt="" style="width:120px;height:60px;opacity:0" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='120' height='60'%3E%3Crect width='120' height='60' fill='%23000'/%3E%3C/svg%3E">
<p id="plain">Plain text, no image here.</p>
<div style="height:900px"></div>
<div id="host"></div>
<script>
const r = document.getElementById('host').attachShadow({ mode: 'open' });
r.innerHTML = `<img id="sh" alt="" style="width:120px;height:60px" src="data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='240' height='120'%3E%3Crect width='240' height='120' fill='%2316a34a'/%3E%3C/svg%3E">`;
</script>
</body></html>
